services:
  app:
    build: .
    # 迁移前置（教程 §8）+ exec：让 bun 接替 sh 成为 PID1。
    # sh -c 包装不转发 SIGTERM，会把优雅停机拖成宽限期后的 SIGKILL（实测 20s/137）
    command: sh -c "bunx prisma migrate deploy && exec bun dist/index.js"
    # 宿主 3000 被本机其他项目占用，映射到 3001
    ports: ['3001:3000']
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/blog
      # ⚠️ 教学占位值：生产必须轮换（≥32 字节），且建议用 secrets 管理而非明文环境变量
      - JWT_SECRET=change-me-at-least-32-bytes-long!!
      - REDIS_URL=redis://redis:6379
      - ENABLE_DOCS=true
    depends_on:
      db:
        condition: service_healthy # 等 PG 真正可接受连接，migrate deploy 才不会首启竞态
      redis:
        condition: service_started
    healthcheck:
      test: ['CMD', 'bun', '-e', "await fetch('http://localhost:3000/healthz').then((r) => { if (!r.ok) process.exit(1) })"]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    image: postgres:17
    environment: [POSTGRES_PASSWORD=postgres, POSTGRES_DB=blog]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
