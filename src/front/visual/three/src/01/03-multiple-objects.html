<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习3：多个物体</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="info">
    练习3：多个物体<br>
    红、绿、蓝三个立方体，不同速度旋转
  </div>

  <!-- 引入 Three.js -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script>
    // 1. 创建场景
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    // 2. 创建相机
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 0, 8);

    // 3. 创建渲染器
    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 4. 创建三个不同颜色的立方体
    const geometry = new THREE.BoxGeometry(1, 1, 1);

    // 红色立方体 - 左侧
    const redMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const redCube = new THREE.Mesh(geometry, redMaterial);
    redCube.position.set(-3, 0, 0);
    scene.add(redCube);

    // 绿色立方体 - 中间
    const greenMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    const greenCube = new THREE.Mesh(geometry, greenMaterial);
    greenCube.position.set(0, 0, 0);
    scene.add(greenCube);

    // 蓝色立方体 - 右侧
    const blueMaterial = new THREE.MeshBasicMaterial({ color: 0x0000ff });
    const blueCube = new THREE.Mesh(geometry, blueMaterial);
    blueCube.position.set(3, 0, 0);
    scene.add(blueCube);

    // 5. 渲染循环（不同速度旋转）
    function animate() {
      requestAnimationFrame(animate);

      // 红色立方体：慢速旋转
      redCube.rotation.x += 0.005;
      redCube.rotation.y += 0.005;

      // 绿色立方体：中速旋转
      greenCube.rotation.x += 0.01;
      greenCube.rotation.y += 0.01;

      // 蓝色立方体：快速旋转
      blueCube.rotation.x += 0.02;
      blueCube.rotation.y += 0.02;

      // 渲染场景
      renderer.render(scene, camera);
    }

    animate();

    // 6. 响应窗口大小变化
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
