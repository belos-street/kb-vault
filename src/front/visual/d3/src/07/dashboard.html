<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3 模块 7 - 数据大屏实战</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; overflow-x: hidden; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto; gap: 15px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .header { grid-column: 1 / -1; text-align: center; padding: 15px; background: linear-gradient(135deg, #16213e, #0f3460); border-radius: 8px; border: 1px solid #1a3a5c; }
        .header h1 { font-size: 1.8em; color: #e2b714; margin-bottom: 5px; }
        .header p { color: #8899aa; font-size: 14px; }
        .card { background: #16213e; border-radius: 8px; padding: 15px; border: 1px solid #1a3a5c; }
        .card h3 { color: #e2b714; margin-bottom: 10px; font-size: 14px; border-bottom: 1px solid #1a3a5c; padding-bottom: 8px; }
        .chart-area { display: flex; justify-content: center; align-items: center; min-height: 250px; }
        .kpi-row { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .kpi-card { background: #16213e; border-radius: 8px; padding: 20px; text-align: center; border: 1px solid #1a3a5c; }
        .kpi-card .kpi-value { font-size: 2em; font-weight: bold; color: #e2b714; }
        .kpi-card .kpi-label { font-size: 13px; color: #8899aa; margin-top: 5px; }
        .kpi-card .kpi-change { font-size: 12px; margin-top: 8px; }
        .kpi-card .kpi-change.up { color: #2ecc71; }
        .kpi-card .kpi-change.down { color: #e74c3c; }
        .tooltip { position: absolute; background: rgba(0, 0, 0, 0.9); color: white; padding: 10px 14px; border-radius: 6px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity 0.2s; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); z-index: 1000; border: 1px solid #1a3a5c; }
        .tooltip .title { font-weight: bold; margin-bottom: 4px; color: #e2b714; }
        .tooltip .value { font-size: 12px; }
        .controls { display: flex; gap: 8px; margin-bottom: 10px; }
        .controls button { padding: 6px 14px; border: 1px solid #1a3a5c; background: #0f3460; color: #eee; border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .controls button:hover { background: #1a3a5c; }
        .controls button.active { background: #e2b714; color: #1a1a2e; border-color: #e2b714; }
        svg text { fill: #8899aa; }
        .axis line, .axis path { stroke: #1a3a5c; }
        .grid line { stroke: #1a3a5c; stroke-dasharray: 2,2; opacity: 0.5; }
        .grid path { stroke-width: 0; }
    </style>
</head>
<body>
    <div class="tooltip" id="tooltip"></div>
    <div class="dashboard">
        <!-- Header -->
        <div class="header">
            <h1>数据大屏</h1>
            <p>D3.js 数据可视化实战项目 — 综合运用模块 1-6 所学知识</p>
        </div>

        <!-- KPI 指标 -->
        <div class="kpi-row">
            <div class="kpi-card">
                <div class="kpi-value" id="kpi1">128,456</div>
                <div class="kpi-label">总销售额</div>
                <div class="kpi-change up">↑ 12.5%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" id="kpi2">3,842</div>
                <div class="kpi-label">订单数</div>
                <div class="kpi-change up">↑ 8.3%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" id="kpi3">68.7%</div>
                <div class="kpi-label">转化率</div>
                <div class="kpi-change down">↓ 2.1%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" id="kpi4">4,521</div>
                <div class="kpi-label">活跃用户</div>
                <div class="kpi-change up">↑ 15.2%</div>
            </div>
        </div>

        <!-- 柱状图 -->
        <div class="card">
            <h3>产品销量排名</h3>
            <div class="controls">
                <button class="active" onclick="updateBarChart('weekly', this)">本周</button>
                <button onclick="updateBarChart('monthly', this)">本月</button>
            </div>
            <div class="chart-area">
                <svg id="barChart"></svg>
            </div>
        </div>

        <!-- 折线图 -->
        <div class="card">
            <h3>月度趋势</h3>
            <div class="chart-area">
                <svg id="lineChart"></svg>
            </div>
        </div>

        <!-- 饼图 -->
        <div class="card">
            <h3>市场占比分布</h3>
            <div class="chart-area">
                <svg id="pieChart"></svg>
            </div>
        </div>

        <!-- 散点图 -->
        <div class="card">
            <h3>用户分布</h3>
            <div class="chart-area">
                <svg id="scatterChart"></svg>
            </div>
        </div>
    </div>

    <script>
        const tooltip = d3.select('#tooltip');
        const chartW = 500, chartH = 250;
        const margin = { top: 20, right: 20, bottom: 40, left: 50 };
        const iw = chartW - margin.left - margin.right;
        const ih = chartH - margin.top - margin.bottom;

        // ============================================================
        // 1. 柱状图
        // ============================================================
        const barData = {
            weekly: [
                { name: '产品A', value: 120 }, { name: '产品B', value: 98 },
                { name: '产品C', value: 86 }, { name: '产品D', value: 73 },
                { name: '产品E', value: 65 }, { name: '产品F', value: 52 }
            ],
            monthly: [
                { name: '产品A', value: 480 }, { name: '产品B', value: 392 },
                { name: '产品C', value: 344 }, { name: '产品D', value: 292 },
                { name: '产品E', value: 260 }, { name: '产品F', value: 208 }
            ]
        };

        const barSvg = d3.select('#barChart').attr('width', chartW).attr('height', chartH);
        const barG = barSvg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

        const barX = d3.scaleBand().range([0, iw]).padding(0.3);
        const barY = d3.scaleLinear().range([ih, 0]);

        barG.append('g').attr('class', 'axis').attr('transform', `translate(0,${ih})`);
        barG.append('g').attr('class', 'axis');

        function updateBarChart(period, btn) {
            if (btn) {
                btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            const data = barData[period];
            barX.domain(data.map(d => d.name));
            barY.domain([0, d3.max(data, d => d.value) * 1.1]);

            barG.selectAll('.axis').filter((d, i) => i === 0)
                .transition().duration(500).call(d3.axisBottom(barX));
            barG.selectAll('.axis').filter((d, i) => i === 1)
                .transition().duration(500).call(d3.axisLeft(barY).ticks(5));

            const bars = barG.selectAll('.bar').data(data, d => d.name);

            bars.enter().append('rect')
                .attr('class', 'bar')
                .attr('x', d => barX(d.name))
                .attr('y', ih)
                .attr('width', barX.bandwidth())
                .attr('height', 0)
                .attr('fill', '#e2b714')
                .attr('rx', 3)
                .attr('cursor', 'pointer')
                .on('mouseover', function(event, d) {
                    d3.select(this).attr('fill', '#fff');
                    tooltip.style('opacity', 1)
                        .html(`<div class="title">${d.name}</div><div class="value">销量: ${d.value}</div>`);
                })
                .on('mousemove', function(event) {
                    tooltip.style('left', (event.pageX + 10) + 'px').style('top', (event.pageY - 30) + 'px');
                })
                .on('mouseout', function() {
                    d3.select(this).attr('fill', '#e2b714');
                    tooltip.style('opacity', 0);
                })
                .transition().duration(500)
                .attr('y', d => barY(d.value))
                .attr('height', d => ih - barY(d.value));

            bars.transition().duration(500)
                .attr('x', d => barX(d.name))
                .attr('y', d => barY(d.value))
                .attr('height', d => ih - barY(d.value));

            bars.exit().transition().duration(500)
                .attr('y', ih).attr('height', 0).remove();
        }
        updateBarChart('weekly');

        // ============================================================
        // 2. 折线图
        // ============================================================
        const lineData = [];
        for (let i = 1; i <= 12; i++) {
            lineData.push({ month: `${i}月`, value: Math.floor(Math.random() * 500 + 200) });
        }

        const lineSvg = d3.select('#lineChart').attr('width', chartW).attr('height', chartH);
        const lineG = lineSvg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

        const lineX = d3.scalePoint().domain(lineData.map(d => d.month)).range([0, iw]).padding(0.5);
        const lineY = d3.scaleLinear().domain([0, d3.max(lineData, d => d.value) * 1.1]).range([ih, 0]);

        lineG.append('g').attr('class', 'grid')
            .call(d3.axisLeft(lineY).ticks(5).tickSize(-iw).tickFormat(''));
        lineG.append('g').attr('class', 'axis').attr('transform', `translate(0,${ih})`).call(d3.axisBottom(lineX));
        lineG.append('g').attr('class', 'axis').call(d3.axisLeft(lineY).ticks(5));

        const lineGen = d3.line().x(d => lineX(d.month)).y(d => lineY(d.value)).curve(d3.curveMonotoneX);
        const areaGen = d3.area().x(d => lineX(d.month)).y0(ih).y1(d => lineY(d.value)).curve(d3.curveMonotoneX);

        lineG.append('path').datum(lineData).attr('fill', '#e2b714').attr('opacity', 0.1).attr('d', areaGen);
        lineG.append('path').datum(lineData).attr('fill', 'none').attr('stroke', '#e2b714').attr('stroke-width', 2.5).attr('d', lineGen);

        lineG.selectAll('.dot').data(lineData).enter().append('circle')
            .attr('cx', d => lineX(d.month)).attr('cy', d => lineY(d.value))
            .attr('r', 4).attr('fill', '#e2b714').attr('stroke', '#16213e').attr('stroke-width', 2)
            .attr('cursor', 'pointer')
            .on('mouseover', function(event, d) {
                d3.select(this).transition().duration(200).attr('r', 7);
                tooltip.style('opacity', 1)
                    .html(`<div class="title">${d.month}</div><div class="value">销售额: ${d.value}</div>`);
            })
            .on('mousemove', function(event) {
                tooltip.style('left', (event.pageX + 10) + 'px').style('top', (event.pageY - 30) + 'px');
            })
            .on('mouseout', function() {
                d3.select(this).transition().duration(200).attr('r', 4);
                tooltip.style('opacity', 0);
            });

        // ============================================================
        // 3. 饼图
        // ============================================================
        const pieData = [
            { name: '华东', value: 35 },
            { name: '华南', value: 25 },
            { name: '华北', value: 20 },
            { name: '西南', value: 12 },
            { name: '其他', value: 8 }
        ];

        const pieW = 350, pieH = 250;
        const pieRadius = Math.min(pieW, pieH) / 2 - 20;

        const pieSvg = d3.select('#pieChart').attr('width', pieW).attr('height', pieH);
        const pieG = pieSvg.append('g').attr('transform', `translate(${pieW / 2},${pieH / 2})`);

        const pieColor = d3.scaleOrdinal(['#e2b714', '#3498db', '#2ecc71', '#e74c3c', '#9b59b6']);
        const pie = d3.pie().value(d => d.value).sort(null).padAngle(0.03);
        const arc = d3.arc().innerRadius(0).outerRadius(pieRadius);
        const arcHover = d3.arc().innerRadius(0).outerRadius(pieRadius + 8);

        const slices = pieG.selectAll('.slice').data(pie(pieData)).enter().append('g').attr('class', 'slice');

        slices.append('path')
            .attr('d', arc)
            .attr('fill', (d, i) => pieColor(i))
            .attr('stroke', '#16213e')
            .attr('stroke-width', 2)
            .attr('cursor', 'pointer')
            .on('mouseover', function(event, d) {
                d3.select(this).transition().duration(200).attr('d', arcHover(d));
                const percent = ((d.endAngle - d.startAngle) / (2 * Math.PI) * 100).toFixed(1);
                tooltip.style('opacity', 1)
                    .html(`<div class="title">${d.data.name}</div><div class="value">占比: ${percent}%<br/>数值: ${d.data.value}</div>`);
            })
            .on('mousemove', function(event) {
                tooltip.style('left', (event.pageX + 10) + 'px').style('top', (event.pageY - 30) + 'px');
            })
            .on('mouseout', function(event, d) {
                d3.select(this).transition().duration(200).attr('d', arc(d));
                tooltip.style('opacity', 0);
            });

        slices.append('text')
            .attr('transform', d => `translate(${arc.centroid(d)})`)
            .attr('text-anchor', 'middle')
            .attr('font-size', '11px')
            .attr('fill', '#fff')
            .attr('font-weight', 'bold')
            .text(d => d.data.name);

        // ============================================================
        // 4. 散点图
        // ============================================================
        const scatterData = [];
        for (let i = 0; i < 30; i++) {
            scatterData.push({
                age: Math.floor(Math.random() * 50 + 18),
                spending: Math.floor(Math.random() * 5000 + 500),
                category: ['新用户', '活跃用户', 'VIP用户'][Math.floor(Math.random() * 3)]
            });
        }

        const scatterSvg = d3.select('#scatterChart').attr('width', chartW).attr('height', chartH);
        const scatterG = scatterSvg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

        const scatterX = d3.scaleLinear().domain([15, 70]).range([0, iw]);
        const scatterY = d3.scaleLinear().domain([0, d3.max(scatterData, d => d.spending) * 1.1]).range([ih, 0]);
        const scatterColor = d3.scaleOrdinal()
            .domain(['新用户', '活跃用户', 'VIP用户'])
            .range(['#3498db', '#2ecc71', '#e2b714']);

        scatterG.append('g').attr('class', 'grid')
            .attr('transform', `translate(0,${ih})`)
            .call(d3.axisBottom(scatterX).ticks(5).tickSize(-ih).tickFormat(''));
        scatterG.append('g').attr('class', 'grid')
            .call(d3.axisLeft(scatterY).ticks(5).tickSize(-iw).tickFormat(''));
        scatterG.append('g').attr('class', 'axis').attr('transform', `translate(0,${ih})`).call(d3.axisBottom(scatterX).ticks(5));
        scatterG.append('g').attr('class', 'axis').call(d3.axisLeft(scatterY).ticks(5));

        scatterG.selectAll('circle').data(scatterData).enter().append('circle')
            .attr('cx', d => scatterX(d.age))
            .attr('cy', d => scatterY(d.spending))
            .attr('r', 5)
            .attr('fill', d => scatterColor(d.category))
            .attr('opacity', 0.7)
            .attr('stroke', '#16213e')
            .attr('stroke-width', 1.5)
            .attr('cursor', 'pointer')
            .on('mouseover', function(event, d) {
                d3.select(this).transition().duration(200).attr('r', 8).attr('opacity', 1);
                tooltip.style('opacity', 1)
                    .html(`<div class="title">${d.category}</div><div class="value">年龄: ${d.age}<br/>消费: ${d.spending}</div>`);
            })
            .on('mousemove', function(event) {
                tooltip.style('left', (event.pageX + 10) + 'px').style('top', (event.pageY - 30) + 'px');
            })
            .on('mouseout', function() {
                d3.select(this).transition().duration(200).attr('r', 5).attr('opacity', 0.7);
                tooltip.style('opacity', 0);
            });

        // 图例
        const legendData = ['新用户', '活跃用户', 'VIP用户'];
        const legendG = scatterG.append('g').attr('transform', `translate(${iw - 120}, 0)`);
        legendData.forEach((cat, i) => {
            const item = legendG.append('g').attr('transform', `translate(0,${i * 20})`);
            item.append('circle').attr('r', 5).attr('fill', scatterColor(cat)).attr('opacity', 0.7);
            item.append('text').attr('x', 12).attr('dy', 4).attr('font-size', '11px').text(cat);
        });

        // ============================================================
        // KPI 数字动画
        // ============================================================
        function animateKPI(selector, target, duration) {
            const el = document.getElementById(selector);
            const start = 0;
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = Math.floor(start + (target - start) * eased);
                el.textContent = current.toLocaleString();
                if (progress < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        animateKPI('kpi1', 128456, 2000);
        animateKPI('kpi2', 3842, 2000);
        animateKPI('kpi3', 687, 2000);
        animateKPI('kpi4', 4521, 2000);

        setTimeout(() => {
            document.getElementById('kpi3').textContent = '68.7%';
        }, 2100);
    </script>
</body>
</html>
