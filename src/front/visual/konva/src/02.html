<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  </head>
  <body>
    <div
      id="root"
      style="width: 800px; height: 400px; border: 1px dashed #ccc"
    ></div>

    <script>
      const stage = new Konva.Stage({
        container: "#root",
        width: 800,
        height: 400,
      });

      const layer = new Konva.Layer();
      stage.add(layer);

      const sun = new Konva.Circle({
        x: 750,
        y: 50,
        radius: 50,
        fill: "yellow",
      });
      layer.add(sun);

      const container = new Konva.Group({
        x: 350,
        y: 280,
        draggable: true,
      });
      layer.add(container);

      
      const wall = new Konva.Rect({
        x: 0,
        y: 0,
        width: 100,
        height: 100,
        fill: "brown",
      });

      const roof = new Konva.Line({
        points: [-10, 0, 50, -50, 110, 0],
        fill: "red",
        closed: true,
      });

      const text = new Konva.Text({
        x: 5,
        y: 100,
        text: "My House",
        fontSize: 20,
        fill: "black",
      });
      container.add(wall);
      container.add(roof);
      container.add(text);
    </script>
  </body>
</html>
