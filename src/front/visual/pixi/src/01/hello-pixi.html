<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 - Hello PixiJS</title>
  <style>* { margin: 0; padding: 0; } body { background: #000; overflow: hidden; }</style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "pixi.js": "https://pixijs.download/release/pixi.min.mjs"
    }
  }
  </script>
  <script type="module">
    import { Application, Graphics } from 'pixi.js';

    async function main() {
      const app = new Application();
      await app.init({ width: 800, height: 600, background: '#16213e' });
      document.body.appendChild(app.canvas);

      // 在画布中心添加一个红色圆形（半径 60）
      const circle = new Graphics();
      circle.circle(0, 0, 60);
      circle.fill(0xff6b6b);
      circle.position.set(app.screen.width / 2, app.screen.height / 2);
      app.stage.addChild(circle);
    }

    main();
  </script>
</body>
</html>
