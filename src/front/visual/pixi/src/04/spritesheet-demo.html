<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>练习 3：精灵图集 (Spritesheet) 演示</title>
  <style>
    body {
      margin: 0;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>

<body>
  <!--
  练习目标：
  1. 加载多张散图（流星、导弹、特效）
  2. 用 Canvas 合成为一张图集大图 + 生成 JSON 帧描述
  3. 用 new Spritesheet(atlasTexture, jsonData) 解析出 spritesheet.textures
  4. 通过 spritesheet.textures['name.png'] 按名取纹理创建精灵
  5. 控制台输出 JSON，验证图集解析成功
  -->
  <script type="importmap">
  {
    "imports": {
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.mjs"
    }
  }
  </script>

  <script type="module">
    // ============================================================
    // 1. 导入 PixiJS
    // ============================================================
    import { Application, Assets, Sprite, Spritesheet, Texture, Text } from 'pixi.js';

    // ============================================================
    // 2. 初始化 PixiJS 应用
    // ============================================================
    const app = new Application();
    await app.init({ width: 800, height: 600, background: '#0f0f23' });
    document.body.appendChild(app.canvas);

    // 画布背景文字提示
    const hintText = app.stage.addChild(new Text({
      text: '正在加载散图并合成 Spritesheet...',
      style: { fill: '#aaaaaa', fontSize: 16 },
    }));
    hintText.x = 20;
    hintText.y = 20;

    // ============================================================
    // 3. 加载散图 —— 从 Kenney 素材包中选取 3 张不同类别的图片
    // ============================================================
    // 素材基础路径（相对于 pages/ 或直接引用本地文件）
    const BASE_PATH = '../assets/kenney_space-shooter-extension/PNG/Sprites X2';

    await Assets.load([
      { alias: 'meteor', src: `${BASE_PATH}/Meteors/spaceMeteors_001.png` },
      { alias: 'missile', src: `${BASE_PATH}/Missiles/spaceMissiles_001.png` },
      { alias: 'ship', src: `${BASE_PATH}/Ships/spaceShips_001.png` },
    ]);

    // 获取加载后的纹理
    const texMeteor = Assets.get('meteor');
    const texMissile = Assets.get('missile');
    const texShip = Assets.get('ship');

    // ============================================================
    // 4. 用 Canvas 合成图集大图 + 生成 JSON 帧描述
    // ============================================================
    // 图片列表（按需排列）
    const srcList = [
      { name: 'meteor', tex: texMeteor },
      { name: 'missile', tex: texMissile },
      { name: 'ship', tex: texShip },
    ];

    const gap = 10; // 图集内图片间距
    let totalWidth = 0;
    let maxHeight = 0;

    srcList.forEach(function (item) {
      totalWidth += item.tex.width + gap;
      maxHeight = Math.max(maxHeight, item.tex.height);
    });

    // 创建 Canvas
    const canvas = document.createElement('canvas');
    canvas.width = totalWidth;
    canvas.height = maxHeight;
    const ctx = canvas.getContext('2d');

    // 构建 JSON 帧描述（Spritesheet 格式）
    const jsonData = {
      frames: {},
      meta: {
        size: { w: totalWidth, h: maxHeight },
      },
    };

    let offsetX = 0;
    srcList.forEach(function (item) {
      // 将散图画到大图上
      const img = item.tex.source.resource;
      ctx.drawImage(img, offsetX, 0);

      // 记录该帧在大图中的位置
      const frameName = item.name + '.png';
      jsonData.frames[frameName] = {
        frame: {
          x: offsetX,
          y: 0,
          w: item.tex.width,
          h: item.tex.height,
        },
        sourceSize: {
          w: item.tex.width,
          h: item.tex.height,
        },
      };

      offsetX += item.tex.width + gap;
    });

    // 控制台输出 JSON，验证图集数据
    console.log('=== Spritesheet JSON ===');
    console.log(JSON.stringify(jsonData, null, 2));
    console.log('========================');

    // ============================================================
    // 5. 解析 Spritesheet
    // ============================================================
    // 从 Canvas 创建纹理
    const atlasTexture = Texture.from(canvas);

    // 创建并解析 Spritesheet
    const spritesheet = new Spritesheet(atlasTexture, jsonData);
    await spritesheet.parse();

    // 验证纹理是否按名取出
    console.log('spritesheet.textures:', spritesheet.textures);
    console.log('meteor texture:', spritesheet.textures['meteor.png']);
    console.log('missile texture:', spritesheet.textures['missile.png']);
    console.log('ship texture:', spritesheet.textures['ship.png']);

    // ============================================================
    // 6. 从图集中按名取纹理，创建精灵并显示
    // ============================================================
    // 更新提示文字
    hintText.text = '✓ 图集解析完成！以下精灵全部从 Spritesheet 中按名取出';

    // 6a. 流星 —— 从图集取纹理
    const meteor = new Sprite(spritesheet.textures['meteor.png']);
    meteor.anchor.set(0.5);
    meteor.scale.set(0.6);
    meteor.x = 200;
    meteor.y = 300;
    app.stage.addChild(meteor);

    // 6b. 导弹
    const missile = new Sprite(spritesheet.textures['missile.png']);
    missile.anchor.set(0.5);
    missile.scale.set(0.6);
    missile.x = 400;
    missile.y = 300;
    app.stage.addChild(missile);

    // 6c. 飞船
    const ship = new Sprite(spritesheet.textures['ship.png']);
    ship.anchor.set(0.5);
    ship.scale.set(0.6);
    ship.x = 600;
    ship.y = 300;
    app.stage.addChild(ship);

    // ============================================================
    // 7. 加个简单动画 —— 让精灵动起来
    // ============================================================
    app.ticker.add(function (time) {
      // 流星上下浮动
      meteor.rotation += 0.01;
      // 导弹旋转
      missile.rotation += 0.02;
    });

    // ============================================================
    // 8. 控制台输出完成标志
    // ============================================================
    console.log('✅ Spritesheet 演示完成！3 个精灵已从图集中按名取出并显示。');
  </script>
</body>

</html>
