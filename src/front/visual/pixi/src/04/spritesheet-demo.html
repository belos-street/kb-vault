<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04 - 练习3：精灵图集</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <!--
    练习 3：精灵图集 & 纹理裁剪

    要求：
    1. 加载多张图片，展示"图集"的概念
    2. 演示 Texture + Rectangle 裁剪：从一张大图中裁出子纹理
    3. 分别创建 Sprite 显示不同纹理

    核心知识点：
    - 实际项目中用 TexturePacker 把多张小图合并为一张大图 + JSON
    - Assets.load('atlas.json') 自动解析出 spritesheet.textures
    - Texture + Rectangle 是图集的底层原理：大图 + 裁剪区域

    本示例：
    - 加载 3 张独立图片（模拟图集中的 3 帧）
    - 演示 Texture + Rectangle 裁剪（从飞船上裁出驾驶舱区域）

    素材来源：Kenney Space Shooter Extension (CC0)
  -->
  <script src="https://pixijs.download/release/pixi.min.js"></script>
  <script>
    const { Application, Assets, Sprite, Text, Texture, Rectangle } = PIXI;

    const BASE = '../assets/kenney_space-shooter-extension/PNG/Sprites X2';

    async function main() {
      const app = new Application();
      await app.init({ width: 800, height: 600, background: '#0f0f23' });
      document.body.appendChild(app.canvas);

      // === 步骤 1：加载 3 张独立图片 ===
      // 实际项目中，这些图片会被 TexturePacker 合并为一张图集
      await Assets.load([
        { alias: 'ship', src: `${BASE}/Ships/spaceShips_001.png` },
        { alias: 'meteor', src: `${BASE}/Meteors/spaceMeteors_001.png` },
        { alias: 'missile', src: `${BASE}/Missiles/spaceMissiles_001.png` },
      ]);

      const shipSprite = new Sprite(Assets.get('ship'));
      shipSprite.anchor.set(0.5);
      shipSprite.position.set(200, 280);
      app.stage.addChild(shipSprite);

      const meteorSprite = new Sprite(Assets.get('meteor'));
      meteorSprite.anchor.set(0.5);
      meteorSprite.position.set(400, 280);
      app.stage.addChild(meteorSprite);

      const missileSprite = new Sprite(Assets.get('missile'));
      missileSprite.anchor.set(0.5);
      missileSprite.position.set(600, 280);
      app.stage.addChild(missileSprite);

      // === 步骤 2：Texture + Rectangle 裁剪演示 ===
      // 从飞船图片中裁剪出中心区域（模拟从图集中裁出子纹理）
      const shipTexture = Assets.get('ship');
      const cropW = Math.floor(shipTexture.width * 0.5);
      const cropH = Math.floor(shipTexture.height * 0.5);
      const cropX = Math.floor((shipTexture.width - cropW) / 2);
      const cropY = Math.floor((shipTexture.height - cropH) / 2);

      const croppedTexture = new Texture({
        source: shipTexture.source,
        frame: new Rectangle(cropX, cropY, cropW, cropH),
      });

      const croppedSprite = new Sprite(croppedTexture);
      croppedSprite.anchor.set(0.5);
      croppedSprite.position.set(400, 480);
      app.stage.addChild(croppedSprite);

      // === 标签 ===
      [{ text: '飞船', x: 200, y: 350 }, { text: '陨石', x: 400, y: 350 }, { text: '导弹', x: 600, y: 350 }].forEach(({ text, x, y }) => {
        const label = new Text({ text, style: { fill: '#ffffff', fontSize: 16, fontFamily: 'Arial' } });
        label.anchor.set(0.5);
        label.position.set(x, y);
        app.stage.addChild(label);
      });

      const cropLabel = new Text({
        text: '飞船裁剪区域（Texture + Rectangle）',
        style: { fill: '#4ecdc4', fontSize: 14, fontFamily: 'Arial' },
      });
      cropLabel.anchor.set(0.5);
      cropLabel.position.set(400, 520);
      app.stage.addChild(cropLabel);

      const hint = new Text({
        text: '3 张独立图片 = 图集中的 3 帧 | 实际项目用 TexturePacker 合并为 JSON + PNG',
        style: { fill: '#888', fontSize: 13, fontFamily: 'Arial' },
      });
      hint.anchor.set(0.5);
      hint.position.set(400, 560);
      app.stage.addChild(hint);

      // 轻微浮动动画
      app.ticker.add((ticker) => {
        const t = Date.now() / 1000;
        shipSprite.y = 280 + Math.sin(t) * 10;
        meteorSprite.y = 280 + Math.sin(t + 2) * 10;
        missileSprite.y = 280 + Math.sin(t + 4) * 10;
      });
    }

    main();
  </script>
</body>

</html>
