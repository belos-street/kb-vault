<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习 3：敌机碰撞</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <!--
    练习 3：敌机碰撞
    要求：
      1. 创建 3 个敌机从顶部向下移动
      2. 空格键发射子弹
      3. 子弹命中敌机后敌机消失（回收到池），子弹也回收
      4. 显示击中计数
    验收标准：击中敌机后两者同时消失，计数器 +1。
  -->
  <script type="importmap">
  {
    "imports": {
      "pixi.js": "https://pixijs.download/release/pixi.min.mjs"
    }
  }
  </script>
  <script type="module">
    import { Application, Graphics, Text, Sprite, Assets } from 'pixi.js';

    // ==================== 通用对象池 ====================
    class ObjectPool {
      constructor(createFn, resetFn, maxSize = 50) {
        this.createFn = createFn;
        this.resetFn = resetFn;
        this.maxSize = maxSize;
        this.pool = [];
        this.active = [];
      }

      get() {
        let obj;
        if (this.pool.length > 0) {
          obj = this.pool.pop();
        } else if (this.active.length < this.maxSize) {
          obj = this.createFn();
        } else {
          return null;
        }
        this.resetFn(obj);
        obj.visible = true;
        this.active.push(obj);
        return obj;
      }

      release(obj) {
        obj.visible = false;
        const idx = this.active.indexOf(obj);
        if (idx !== -1) {
          this.active.splice(idx, 1);
          this.pool.push(obj);
        }
      }

      releaseAll() {
        while (this.active.length > 0) {
          const obj = this.active.pop();
          obj.visible = false;
          this.pool.push(obj);
        }
      }
    }

    async function main() {
      // ==================== 初始化应用 ====================
      const app = new Application();
      await app.init({ width: 800, height: 600, background: '#0f0f23' });
      document.body.appendChild(app.canvas);

      // ==================== 加载资源 ====================
      const [shipTexture, enemyTexture] = await Promise.all([
        Assets.load('../assets/kenney_space-shooter-extension/PNG/Sprites X2/Ships/spaceShips_001.png'),
        Assets.load('../assets/kenney_space-shooter-extension/PNG/Sprites X2/Meteors/spaceMeteors_001.png'),
      ]);

      // ==================== 玩家飞船 ====================
      const player = new Sprite(shipTexture);
      player.anchor.set(0.5);
      player.scale.set(0.5);
      player.position.set(400, 520);
      app.stage.addChild(player);

      // (练习 3 暂不要求陨石撞飞机的碰撞逻辑)

      const keys = {};
      window.addEventListener('keydown', (e) => { keys[e.code] = true; });
      window.addEventListener('keyup', (e) => { keys[e.code] = false; });

      // ==================== 子弹纹理 ====================
      const bulletGfx = new Graphics();
      bulletGfx.rect(0, 0, 4, 12);
      bulletGfx.fill(0xffd93d);
      const bulletTexture = app.renderer.generateTexture(bulletGfx);

      // ==================== 子弹池 ====================
      const bulletPool = new ObjectPool(
        () => {
          const bullet = new Sprite(bulletTexture);
          bullet.anchor.set(0.5);
          bullet.radius = 4;
          app.stage.addChild(bullet);
          return bullet;
        },
        (bullet) => {
          bullet.x = 0;
          bullet.y = 0;
          bullet.alpha = 1;
        },
        30
      );

      // ==================== 敌机池 ====================
      const enemyPool = new ObjectPool(
        () => {
          const enemy = new Sprite(enemyTexture);
          enemy.anchor.set(0.5);
          enemy.scale.set(0.4);
          app.stage.addChild(enemy);
          return enemy;
        },
        (enemy) => {
          enemy.x = 0;
          enemy.y = 0;
          enemy.alpha = 1;
          enemy.radius = enemy.width / 2; // 根据纹理实际渲染尺寸计算碰撞半径
        },
        10
      );

      // ==================== 碰撞检测 ====================
      function circleHit(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const r = (a.radius || 10) + (b.radius || 10);
        return dx * dx + dy * dy < r * r;
      }

      // ==================== 击中计数 ====================
      let hitCount = 0;

      const scoreText = new Text({
        text: '击中: 0',
        style: { fill: '#ffd93d', fontSize: 22, fontFamily: 'monospace', fontWeight: 'bold' },
      });
      scoreText.position.set(10, 10);
      app.stage.addChild(scoreText);

      const hintText = new Text({
        text: '← → 移动  |  空格射击',
        style: { fill: '#888888', fontSize: 14, fontFamily: 'Arial' },
      });
      hintText.position.set(10, 40);
      app.stage.addChild(hintText);

      // ==================== 游戏控制 ====================
      let shootCooldown = 0;
      const SHOOT_INTERVAL = 8;
      let spawnTimer = 0;
      const SPAWN_INTERVAL = 60;

      // 初始化 3 架敌机
      for (let i = 0; i < 3; i++) {
        const enemy = enemyPool.get();
        if (enemy) {
          enemy.x = 100 + Math.random() * 600;
          enemy.y = -40 - Math.random() * 100;
        }
      }

      const PLAYER_SPEED = 5;
      const BULLET_SPEED = 8;
      const ENEMY_SPEED = 2;

      // ==================== 游戏循环 ====================
      app.ticker.add((ticker) => {
        const dt = ticker.deltaTime;

        // 玩家移动
        if (keys['ArrowLeft'] || keys['KeyA']) player.x -= PLAYER_SPEED * dt;
        if (keys['ArrowRight'] || keys['KeyD']) player.x += PLAYER_SPEED * dt;

        const halfW = player.width / 2;
        player.x = Math.max(halfW, Math.min(800 - halfW, player.x));

        // 射击
        shootCooldown -= dt;
        if (keys['Space'] && shootCooldown <= 0) {
          const bullet = bulletPool.get();
          if (bullet) {
            bullet.x = player.x;
            bullet.y = player.y - 20;
          }
          shootCooldown = SHOOT_INTERVAL;
        }

        // 敌机生成
        spawnTimer -= dt;
        if (spawnTimer <= 0 && enemyPool.active.length < 6) {
          const enemy = enemyPool.get();
          if (enemy) {
            enemy.x = 50 + Math.random() * 700;
            enemy.y = -40;
          }
          spawnTimer = SPAWN_INTERVAL;
        }

        // 子弹移动 + 回收
        for (let i = bulletPool.active.length - 1; i >= 0; i--) {
          const bullet = bulletPool.active[i];
          bullet.y -= BULLET_SPEED * dt;

          if (bullet.y < -20) {
            bulletPool.release(bullet);
          }
        }

        // 敌机移动 + 回收
        for (let i = enemyPool.active.length - 1; i >= 0; i--) {
          const enemy = enemyPool.active[i];
          enemy.y += ENEMY_SPEED * dt;

          if (enemy.y > 650) {
            enemyPool.release(enemy);
          }
        }

        // 碰撞检测（子弹 vs 敌机）
        for (let i = bulletPool.active.length - 1; i >= 0; i--) {
          const bullet = bulletPool.active[i];

          for (let j = enemyPool.active.length - 1; j >= 0; j--) {
            const enemy = enemyPool.active[j];

            if (circleHit(bullet, enemy)) {
              bulletPool.release(bullet);
              enemyPool.release(enemy);
              hitCount++;
              scoreText.text = `击中: ${hitCount}`;
              break;
            }
          }
        }
      });
    }

    main();
  </script>
</body>

</html>
