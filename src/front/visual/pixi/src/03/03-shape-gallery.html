<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03 - 图形画廊（带标签）</title>
  <style>* { margin: 0; padding: 0; } body { background: #000; overflow: hidden; }</style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "pixi.js": "https://pixijs.download/release/pixi.min.mjs"
    }
  }
  </script>
  <script type="module">
    import { Application, Graphics, Text, Container } from 'pixi.js';

    async function main() {
      const app = new Application();
      await app.init({ width: 800, height: 600, background: '#0f0f23' });
      document.body.appendChild(app.canvas);

      // 6 种形状：2 行 3 列布局
      const shapes = [
        { name: '矩形', draw: (g) => { g.rect(-40, -30, 80, 60); }, color: 0xff6b6b },
        { name: '圆角矩形', draw: (g) => { g.roundRect(-40, -30, 80, 60, 12); }, color: 0x4ecdc4 },
        { name: '圆形', draw: (g) => { g.circle(0, 0, 35); }, color: 0xffd93d },
        { name: '椭圆', draw: (g) => { g.ellipse(0, 0, 50, 30); }, color: 0xa8e6cf },
        { name: '星形', draw: (g) => { g.star(0, 0, 5, 40, 20); }, color: 0x6c5ce7 },
        { name: '六边形', draw: (g) => { g.regularPolygon(0, 0, 35, 6); }, color: 0xff8a5c },
      ];

      const cols = 3;
      const cellW = 800 / cols;
      const cellH = 300;

      shapes.forEach((shape, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const cx = cellW * col + cellW / 2;
        const cy = cellH * row + cellH / 2;

        const group = new Container();

        // 形状
        const g = new Graphics();
        shape.draw(g);
        g.fill(shape.color);
        group.addChild(g);

        // 标签
        const label = new Text({
          text: shape.name,
          style: { fill: '#ffffff', fontSize: 16, fontFamily: 'Arial' },
        });
        label.anchor.set(0.5);
        label.position.set(0, 55);
        group.addChild(label);

        group.position.set(cx, cy);
        app.stage.addChild(group);
      });
    }

    main();
  </script>
</body>
</html>
