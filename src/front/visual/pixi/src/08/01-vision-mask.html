<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08 - 练习1：视野遮罩</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!--
    练习 1：视野遮罩
    要求：
      1. 创建一个大背景图或用 Graphics 绘制多个散落的图形
      2. 用圆形遮罩实现"视野"效果，只显示鼠标周围区域
      3. 鼠标移动时遮罩跟随
    验收标准：只有鼠标周围 150px 半径的区域可见，其余被遮罩裁剪。
  -->
    <script src="https://pixijs.download/release/pixi.min.js"></script>
    <script>
        const { Application, Graphics, Text } = PIXI;

        async function main() {
            const app = new Application();
            await app.init({ width: 800, height: 600, background: '#0f0f23' });
            document.body.appendChild(app.canvas);

            // ==================== 1. 散落的图形（模拟背景内容） ====================
            const world = new PIXI.Container();
            app.stage.addChild(world);

            const colors = [0xff6b6b, 0x4ecdc4, 0xffd93d, 0x6c5ce7, 0xff9ff3, 0x54a0ff];
            const shapes = [];

            for (let i = 0; i < 30; i++) {
                const g = new Graphics();
                const color = colors[Math.floor(Math.random() * colors.length)];
                const shapeType = Math.floor(Math.random() * 3);

                if (shapeType === 0) {
                    g.circle(0, 0, 10 + Math.random() * 30);
                    g.fill(color);
                } else if (shapeType === 1) {
                    g.rect(0, 0, 20 + Math.random() * 40, 20 + Math.random() * 40);
                    g.fill(color);
                } else {
                    g.moveTo(0, -20);
                    g.lineTo(20, 15);
                    g.lineTo(-20, 15);
                    g.closePath();
                    g.fill(color);
                }

                g.position.set(Math.random() * 800, Math.random() * 600);
                g.rotation = Math.random() * Math.PI * 2;
                world.addChild(g);
                shapes.push(g);
            }

            // 添加文字说明
            const label = new Text({
                text: '暗处是遮罩裁剪的区域',
                style: { fill: '#ffffff', fontSize: 16, fontFamily: 'Arial' },
            });
            label.anchor.set(0.5);
            label.position.set(400, 30);
            world.addChild(label);

            // ==================== 2. 圆形遮罩（视野效果） ====================
            const mask = new Graphics();
            mask.circle(0, 0, 150);
            mask.fill(0xffffff);

            // 应用遮罩到 world 容器
            world.mask = mask;
            app.stage.addChild(mask);

            // ==================== 3. 鼠标跟随 ====================
            app.stage.eventMode = 'static';
            app.stage.hitArea = app.screen;

            app.stage.on('pointermove', (e) => {
                mask.x = e.global.x;
                mask.y = e.global.y;
            });

            // ==================== 4. 空格切换遮罩 ====================
            let maskEnabled = true;
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    maskEnabled = !maskEnabled;
                    world.mask = maskEnabled ? mask : null;
                    hintText.text = maskEnabled
                        ? '空格关闭遮罩 | 移动鼠标查看视野'
                        : '空格打开遮罩 | 遮罩已关闭，全部可见';
                }
            });

            const hintText = new Text({
                text: '移动鼠标 — 只有圆形区域内可见  |  空格切换遮罩',
                style: { fill: '#888888', fontSize: 14, fontFamily: 'Arial' },
            });
            hintText.anchor.set(0.5);
            hintText.position.set(400, 570);
            app.stage.addChild(hintText);

            console.log('练习 1 已启动 — 移动鼠标查看视野遮罩效果！按空格切换遮罩开关。');
        }

        main();
    </script>
</body>

</html>
