<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08 - 练习3：爆炸粒子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!--
    练习 3：爆炸粒子
    要求：
      1. 点击画布任意位置触发爆炸效果
      2. 30 个粒子从点击位置向四周扩散
      3. 粒子逐渐变透明并消失
      4. 使用 ParticleContainer 优化性能
    验收标准：点击产生爆炸粒子效果，连续点击不卡顿。
  -->
    <script type="importmap">
  {
    "imports": {
      "pixi.js": "https://pixijs.download/release/pixi.min.mjs"
    }
  }
  </script>
  <script type="module">
    import { Application, Graphics, ParticleContainer, Particle, Text } from 'pixi.js';

        async function main() {
            const app = new Application();
            await app.init({ width: 800, height: 600, background: '#0f0f23' });
            document.body.appendChild(app.canvas);

            // ==================== 生成粒子纹理 ====================
            const particleGfx = new Graphics();
            particleGfx.circle(0, 0, 3);
            particleGfx.fill(0xffd93d);
            const particleTex = app.renderer.generateTexture(particleGfx);

            // ==================== ParticleContainer（大容量优化） ====================
            const container = new ParticleContainer({
                dynamicProperties: {
                    position: true,
                    scale: true,
                    alpha: true,
                    color: true,
                },
            });
            app.stage.addChild(container);

            // ==================== 爆炸函数 ====================
            function createExplosion(x, y) {
                const count = 30;
                const particles = [];

                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 4;
                    const tint = [0xffd93d, 0xff6b6b, 0xffffff][Math.floor(Math.random() * 3)];

                    const p = new Particle({
                        texture: particleTex,
                        x,
                        y,
                        anchor: { x: 0.5, y: 0.5 },
                        scale: 0.5 + Math.random() * 1.5,
                        tint,
                        alpha: 1,
                    });

                    // 自定义属性：运动方向和生命值
                    p.vx = Math.cos(angle) * speed;
                    p.vy = Math.sin(angle) * speed;
                    p.life = 1;

                    container.addParticle(p);
                    particles.push(p);
                }

                // 更新粒子动画
                const update = (ticker) => {
                    const dt = ticker.deltaTime;
                    let alive = false;

                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.x += p.vx * dt;
                        p.y += p.vy * dt;
                        p.life -= 0.025 * dt;
                        p.alpha = p.life;
                        p.scale = p.life * 1.5;

                        if (p.life > 0) {
                            alive = true;
                        } else {
                            container.removeParticle(p);
                            particles.splice(i, 1);
                        }
                    }

                    if (!alive) {
                        app.ticker.remove(update);
                    }
                };

                app.ticker.add(update);
            }

            // ==================== 点击触发 ====================
            app.stage.eventMode = 'static';
            app.stage.hitArea = app.screen;

            app.stage.on('pointertap', (e) => {
                createExplosion(e.global.x, e.global.y);
            });

            // ==================== UI ====================
            const hitText = new Text({
                text: '点击任意位置触发爆炸',
                style: { fill: '#888888', fontSize: 14, fontFamily: 'Arial' },
            });
            hitText.anchor.set(0.5);
            hitText.position.set(400, 570);
            app.stage.addChild(hitText);

            let clickCount = 0;
            const countText = new Text({
                text: '爆炸次数: 0',
                style: { fill: '#ffffff', fontSize: 18, fontFamily: 'monospace' },
            });
            countText.position.set(10, 10);
            app.stage.addChild(countText);

            app.stage.on('pointertap', () => {
                clickCount++;
                countText.text = `爆炸次数: ${clickCount}`;
            });

            console.log('练习 3 已启动 — 点击画布触发爆炸粒子效果！');
        }

        main();
    </script>
</body>

</html>
