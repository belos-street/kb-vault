name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.vitepress/**'
      - '.github/workflows/deploy.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated 需要完整 git 历史
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build Lexio (base=/kb-vault/lexio/)
        working-directory: src/english/general/platform
        run: |
          bun install
          bun run validate
          bun run check
          bun run build --base=/kb-vault/lexio/
      - name: Build grammar-play (base=/kb-vault/grammar-play/)
        working-directory: src/english/grammar/playground
        run: |
          bun install
          bun run build-data
          bun run validate
          bun run check
          bun test
          bun run build --base=/kb-vault/grammar-play/
      - name: Build grammar-course (base=/kb-vault/grammar-course/)
        working-directory: src/english/grammar-course/platform
        run: |
          bun install
          bun run build-data
          bun run validate
          bun run check
          bun test
          bun run build --base=/kb-vault/grammar-course/
      - name: Assemble Pages artifact（知识库根路径 + lexio/ + grammar-play/ + grammar-course/ 子路径）
        run: |
          mkdir -p .vitepress/dist/lexio .vitepress/dist/grammar-play .vitepress/dist/grammar-course
          cp -r src/english/general/platform/dist/* .vitepress/dist/lexio/
          cp -r src/english/grammar/playground/dist/* .vitepress/dist/grammar-play/
          cp -r src/english/grammar-course/platform/dist/* .vitepress/dist/grammar-course/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
