name: blog-api CI

# 只盯实战 B 项目目录，笔记改动不跑流水线
on:
  push:
    paths:
      - 'src/server/frame/hono/project/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/server/frame/hono/project/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server/frame/hono/project
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      # 测试专用值：过 env.ts 的 fail-fast（≥32 字节），非生产凭据
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/blog_test
      REDIS_URL_TEST: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint (oxlint)
        run: bun run lint
      - name: Format check (oxfmt)
        run: bunx oxfmt --check src prisma scripts
      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck
      # test:setup 里 db push 会自动建 blog_test 并 seed，随后 bun test 全量跑
      - name: Test (bun test)
        run: bun run test
      - name: Docker build
        run: docker build -t blog-api:ci .
