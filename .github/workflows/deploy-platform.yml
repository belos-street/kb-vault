name: deploy-platform

on:
  push:
    paths:
      - 'src/english/general/platform/**'
      - 'src/english/general/book-01-foundation/01-句子工程/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate & Check
        working-directory: src/english/general/platform
        run: |
          bun install
          bun run validate
          bun run check

      - name: Build (base=/kb-vault/lexio/)
        working-directory: src/english/general/platform
        run: bun run build --base=/kb-vault/lexio/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/english/general/platform/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
